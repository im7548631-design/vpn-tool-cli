[package]
name = "vpn-tool"
version = "1.0.0"
edition = "2021"
authors = ["Developer <developer@example.com>"]
description = "A robust, modular Rust CLI tool to manage VPN gateways, handle API interactions, and execute system commands."

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
sha2 = "0.10"
urlencoding = "2.1"
